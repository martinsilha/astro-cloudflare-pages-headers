name: Compatibility

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev, main]
  workflow_call:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run types && pnpm run lint && pnpm run test:unit && pnpm run build:lib
      - run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: astro-headers-package
          path: ${{ runner.temp }}/astro-cloudflare-pages-headers-*.tgz
          if-no-files-found: error

  consumer-matrix:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - astro: '4.0.0'
            adapter: '8.1.0'
            wrangler: '3.114.17'
            major: '4'
            node: '18.20.8'
            http: false
          - astro: '4.16.19'
            adapter: '11.2.0'
            wrangler: '3.114.17'
            major: '4'
            node: '18.20.8'
            http: false
          - astro: '5.0.0'
            adapter: '12.0.0'
            wrangler: '4.59.2'
            major: '5'
            node: '24.14.0'
            http: false
          - astro: '5.18.2'
            adapter: '12.6.13'
            wrangler: '4.59.2'
            major: '5'
            node: '24.14.0'
            http: false
          - astro: '6.0.0'
            adapter: '13.0.0'
            wrangler: '4.144.0'
            major: '6'
            node: '24.14.0'
            http: false
          - astro: '6.4.8'
            adapter: '13.7.0'
            wrangler: '4.144.0'
            major: '6'
            node: '24.14.0'
            http: true
          - astro: '7.0.0'
            adapter: '14.0.0'
            wrangler: '4.144.0'
            major: '7'
            node: '24.14.0'
            http: false
          - astro: '7.3.5'
            adapter: '14.3.3'
            wrangler: '4.144.0'
            major: '7'
            node: '24.14.0'
            http: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/download-artifact@v4
        with:
          name: astro-headers-package
          path: fixtures/astro-consumer
      - name: Build packed consumer matrix
        env:
          FIXTURE_ASTRO_VERSION: ${{ matrix.astro }}
          FIXTURE_ADAPTER_VERSION: ${{ matrix.adapter }}
          FIXTURE_WRANGLER_VERSION: ${{ matrix.wrangler }}
        run: pnpm run test:compatibility
