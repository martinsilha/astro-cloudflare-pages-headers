name: Nonpublishing canary

on:
  push:
    branches: [codex/fix-v2-release-gates]

permissions:
  contents: read

concurrency:
  group: nonpublishing-canary-${{ github.repository }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/codex/fix-v2-release-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unchanged release quality gates
        run: pnpm run types && pnpm run lint && pnpm run test:coverage:check && pnpm run test:property && pnpm run test:release && pnpm run test:mutation && pnpm run build:lib
      - name: Prepare a uniquely versioned test artifact
        id: candidate
        env:
          CANDIDATE_VERSION: 2.0.0-canary.${{ github.run_id }}.${{ github.run_attempt }}
        run: |
          mkdir -p .release-artifacts
          npm version "$CANDIDATE_VERSION" --no-git-tag-version --ignore-scripts
          pnpm pack --pack-destination .release-artifacts
          echo "version=$CANDIDATE_VERSION" >> "$GITHUB_OUTPUT"
          cd .release-artifacts
          sha256sum "astro-cloudflare-pages-headers-$CANDIDATE_VERSION.tgz" > SHA256SUMS
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const report = {sourceSha: process.env.GITHUB_SHA, version: process.env.CANDIDATE_VERSION, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, published: false};
          await fs.writeFile('candidate.json', JSON.stringify(report, null, 2) + '\n');
          NODE
      - name: Retain candidate and gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .release-artifacts/
            coverage/coverage-summary.json
            coverage/lcov.info
            reports/mutation/
          if-no-files-found: error
          retention-days: 30

  canary:
    needs: candidate
    if: github.ref == 'refs/heads/codex/fix-v2-release-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: cloudflare-canary
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: canary-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate-evidence
      - name: Verify immutable artifact checksum and version
        env:
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          cd .candidate-evidence/.release-artifacts
          sha256sum --check SHA256SUMS
          node --input-type=module <<'NODE'
          import {inspectReleaseTarball} from '../../scripts/semantic-release-exact-artifact.mjs';
          import fs from 'node:fs/promises';
          const metadata = JSON.parse(await fs.readFile('candidate.json', 'utf8'));
          if (metadata.sourceSha !== process.env.GITHUB_SHA || metadata.published !== false) throw new Error('Candidate provenance mismatch');
          await inspectReleaseTarball({tarballPath: `astro-cloudflare-pages-headers-${process.env.CANDIDATE_VERSION}.tgz`, version: process.env.CANDIDATE_VERSION});
          NODE
      - name: Install all browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Verify narrowly configured token and run exact-candidate matrix
        env:
          CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_TEST_PAGES_PROJECT: ${{ vars.CF_TEST_PAGES_PROJECT }}
          PLAYWRIGHT_PROJECTS: chromium,firefox,webkit
          RELEASE_MATRIX_CONCURRENCY: 2
          WRANGLER_SEND_METRICS: 'false'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          if (process.env.CLOUDFLARE_ACCOUNT_ID !== 'e9881c126eba9d4bda273118fe943b5c' || process.env.CF_TEST_PAGES_PROJECT !== 'astro-cloudflare-headers-canary' || !process.env.CLOUDFLARE_API_TOKEN) throw new Error('Canary environment configuration mismatch');
          const response = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', {headers: {Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`}, signal: AbortSignal.timeout(20000)});
          const payload = await response.json();
          if (!response.ok || !payload.success || payload.result?.status !== 'active' || payload.result.expires_on !== '2026-11-01T21:45:00Z') throw new Error('Token verification or approved expiry check failed');
          await fs.mkdir('.release-artifacts', {recursive: true});
          await fs.writeFile('.release-artifacts/token-verification.json', JSON.stringify(payload.result, null, 2) + '\n');
          NODE
          node scripts/run-release-candidate-matrix.mjs ".candidate-evidence/.release-artifacts/astro-cloudflare-pages-headers-$CANDIDATE_VERSION.tgz"
      - name: Verify all canaries passed and per-run cleanup completed
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const directory = 'test-results/cloudflare';
          const records = await Promise.all((await fs.readdir(directory)).filter(name => name.startsWith('resource-') && name.endsWith('.json')).map(async name => JSON.parse(await fs.readFile(`${directory}/${name}`, 'utf8'))));
          const expected = new Set(['6:worker', '7:worker', '7:pages']);
          for (const record of records) {
            if (record.status !== 'passed' || record.cleanup !== 'passed' || record.cleanupErrors?.length) throw new Error('Canary assertions or cleanup failed');
            expected.delete(`${record.major}:${record.target}`);
          }
          if (expected.size || records.length !== 3) throw new Error('Missing or unexpected per-run canary evidence');
          NODE
      - name: Retain exact candidate, matrix, browser, and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-validation-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .candidate-evidence/
            .release-artifacts/
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 30
