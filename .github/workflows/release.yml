name: Release

on:
  push:
    branches:
      - dev
      - main

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  compatibility:
    uses: ./.github/workflows/compatibility.yml
    with:
      release_validation: true

  release:
    needs: compatibility
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-canary
      url: https://astro-cloudflare-headers-canary.pages.dev
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    timeout-minutes: 60
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_TEST_PAGES_PROJECT: ${{ vars.CF_TEST_PAGES_PROJECT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node.js and npm registry auth
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download PR and release validation evidence
        uses: actions/download-artifact@v4
        with:
          path: .release-evidence

      - name: Validate release credentials and evidence
        run: node scripts/check-release-preflight.mjs

      - name: Run release checks and critical mutation suite
        run: pnpm run types && pnpm run lint && pnpm run test:coverage:check && pnpm run test:release && pnpm run test:mutation

      - name: Install all Playwright browsers for deployed candidate canaries
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run semantic release with the validated immutable tarball
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      - name: Retain release evidence, tarball, checksums, and canary reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            .release-artifacts/
            .release-evidence/
            test-results/
            coverage/coverage-summary.json
            coverage/lcov.info
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30
