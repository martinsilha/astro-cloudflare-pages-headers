name: Test

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run critical PR gates
        run: pnpm run types && pnpm run lint && pnpm run test:coverage:check && pnpm run test:property && pnpm run test:release && pnpm run build:lib

      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14
